# IA.CFG - PLANTILLA. Copia este fichero a IA.CFG y pon tus claves API.
#
# Pon la API key (despues del =) de cada IA que quieras usar.
# Deja key= vacia en las IA que NO uses: no apareceran como
# opcion de conexion en el programa.
#
# Donde conseguir cada clave (gratis, sin tarjeta):
#   groq     -> https://console.groq.com           (gsk_...)
#   cerebras -> https://cloud.cerebras.ai           (csk-...)
#   gemini   -> https://aistudio.google.com/apikey  (AQ... o AIza...)

[groq]
key=

[cerebras]
key=

[gemini]
key=
